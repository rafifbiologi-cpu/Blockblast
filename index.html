<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0b1f" />
  <title>Block Blast</title>
  <style>
/* ============ Dasar ============ */
:root {
  --bs: max(260px, min(92vw, 440px, calc(100dvh - 380px)));
  --gap: 3px;
  --pad: 8px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color: #fff;
  background: #0b0b1f;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(circle at 15% 10%, rgba(99, 70, 255, .35), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 165, 233, .30), transparent 45%),
    radial-gradient(circle at 80% 15%, rgba(236, 72, 153, .18), transparent 40%),
    linear-gradient(160deg, #15153d, #0b0b1f);
  animation: bgShift 14s ease-in-out infinite alternate;
}
@keyframes bgShift {
  from { filter: hue-rotate(0deg); }
  to   { filter: hue-rotate(35deg); }
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 0;
}

/* ============ Header ============ */
.logo {
  margin: 0;
  font-size: clamp(22px, 6vw, 32px);
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #7aa2ff, #c084fc, #ff8ad8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35));
}
.logo span { margin-left: 6px; background: linear-gradient(90deg, #ffe066, #ff7a8a); -webkit-background-clip: text; background-clip: text; }

.stats {
  width: var(--bs);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 0 8px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12);
  backdrop-filter: blur(6px);
}
.stat .label { font-size: 11px; letter-spacing: 2px; opacity: .65; }
.stat .value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat.best .value { color: #ffe066; }
.value.bump { animation: bump .3s ease; }
@keyframes bump { 50% { transform: scale(1.22); color: #fff; } }

/* ============ Papan ============ */
.board-wrap {
  position: relative;
  width: var(--bs);
  height: var(--bs);
}

.board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  gap: var(--gap);
  padding: var(--pad);
  border-radius: 18px;
  background: rgba(8, 8, 32, .7);
  box-shadow:
    0 0 0 2px rgba(255, 255, 255, .08),
    0 18px 50px rgba(0, 0, 0, .55),
    inset 0 0 40px rgba(99, 70, 255, .15);
  backdrop-filter: blur(8px);
}

.board.shake1 { animation: shake1 .35s ease; }
.board.shake2 { animation: shake2 .45s ease; }
.board.shake3 { animation: shake3 .6s ease; }
@keyframes shake1 { 20%{transform:translate(-2px,1px)} 40%{transform:translate(2px,-1px)} 60%{transform:translate(-1px,1px)} 80%{transform:translate(1px,0)} }
@keyframes shake2 { 15%{transform:translate(-4px,2px) rotate(-.3deg)} 30%{transform:translate(4px,-2px) rotate(.3deg)} 45%{transform:translate(-3px,2px)} 60%{transform:translate(3px,-1px)} 80%{transform:translate(-1px,1px)} }
@keyframes shake3 { 10%{transform:translate(-7px,3px) rotate(-.6deg)} 25%{transform:translate(7px,-3px) rotate(.6deg)} 40%{transform:translate(-5px,3px) rotate(-.4deg)} 55%{transform:translate(5px,-2px)} 70%{transform:translate(-3px,2px)} 85%{transform:translate(2px,-1px)} }

/* ============ Sel & blok ============ */
.cell {
  border-radius: 20%;
  background: rgba(255, 255, 255, .06);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .03);
  position: relative;
}
.cell.alt { background: rgba(255, 255, 255, .095); }

.filled,
.block,
.preview {
  background: linear-gradient(150deg, var(--a), var(--b));
  box-shadow:
    inset 0 2px 1px rgba(255, 255, 255, .55),
    inset 0 -3px 2px rgba(0, 0, 0, .28),
    0 1px 4px rgba(0, 0, 0, .4);
}
.block { border-radius: 20%; }

.preview {
  opacity: .55;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55);
}

/* garis yang akan hancur */
.hint {
  z-index: 2;
  opacity: 1 !important;
  box-shadow: 0 0 0 2px #fff, 0 0 16px 3px var(--a, #fff), inset 0 2px 1px rgba(255, 255, 255, .6) !important;
  animation: hintPulse .6s ease-in-out infinite alternate;
}
@keyframes hintPulse { to { filter: brightness(1.45); } }

.c0 { --a: #ff7a8a; --b: #e0204a; }
.c1 { --a: #ffb454; --b: #f07a12; }
.c2 { --a: #ffe066; --b: #f2b705; }
.c3 { --a: #6ee7a0; --b: #12b76a; }
.c4 { --a: #5fd8ff; --b: #0891d1; }
.c5 { --a: #7aa2ff; --b: #3b55e6; }
.c6 { --a: #c084fc; --b: #8b3dde; }
.c7 { --a: #ff8ad8; --b: #e0359e; }

.cell.placed { animation: placedPop .26s ease-out; }
@keyframes placedPop {
  0%   { transform: scale(.55); filter: brightness(1.8); }
  60%  { transform: scale(1.1); }
  100% { transform: scale(1); filter: none; }
}

/* ===== EFEK MELEBUR ===== */
.cell.clearing {
  z-index: 3;
  animation: clearPop .52s cubic-bezier(.45, 0, .7, .25) both;
}
@keyframes clearPop {
  0%   { transform: scale(1); filter: brightness(1); }
  30%  {
    transform: scale(1.22);
    filter: brightness(2.4) saturate(1.5);
    box-shadow: 0 0 26px 8px #fff, inset 0 0 12px #fff;
  }
  60%  { transform: scale(.9) rotate(45deg); filter: brightness(3); opacity: 1; }
  100% { transform: scale(0) rotate(135deg); filter: brightness(4); opacity: 0; }
}

.cell.dead {
  filter: grayscale(1) brightness(.55);
  transition: filter .4s ease;
}

/* ============ Popup ============ */
.popup {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 30;
  width: max-content;
}
.pop { text-align: center; animation: popUp 1.15s cubic-bezier(.2, .9, .3, 1.2) both; }
.pop-text {
  font-size: clamp(26px, 8vw, 46px);
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
  background: linear-gradient(180deg, #fff, #ffe066 60%, #ff9a3c);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .4)) drop-shadow(0 0 14px rgba(255, 200, 80, .7));
}
.pop-sub {
  font-weight: 800;
  font-size: clamp(14px, 4vw, 20px);
  color: #7ff0ff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 10px rgba(80, 220, 255, .8);
}
.pop-score {
  font-weight: 900;
  font-size: clamp(18px, 5vw, 26px);
  color: #fff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .5);
}
@keyframes popUp {
  0%   { opacity: 0; transform: translateY(14px) scale(.3); }
  20%  { opacity: 1; transform: translateY(0) scale(1.18); }
  35%  { transform: scale(1); }
  75%  { opacity: 1; transform: translateY(-16px) scale(1); }
  100% { opacity: 0; transform: translateY(-46px) scale(1.06); }
}

/* ============ Tray potongan ============ */
.tray {
  width: var(--bs);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.slot {
  height: max(84px, calc(var(--bs) * .27));
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: rgba(255, 255, 255, .05);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
  touch-action: none;
  cursor: grab;
}

.piece { display: grid; }
.slot .piece { transition: opacity .15s, filter .2s; }
.slot .piece.enter { animation: pieceIn .4s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes pieceIn { from { opacity: 0; transform: translateY(24px) scale(.5); } to { opacity: 1; transform: none; } }
.slot .piece.picked { opacity: .2; }
.slot .piece.disabled { opacity: .35; filter: grayscale(.9); }

.piece.floating {
  position: fixed;
  z-index: 1000;
  margin: 0;
  pointer-events: none;
  filter: drop-shadow(0 14px 12px rgba(0, 0, 0, .5));
  animation: lift .12s ease-out;
}
@keyframes lift { from { transform: scale(.7); } to { transform: scale(1); } }

/* ============ Tombol ============ */
.controls { display: flex; gap: 10px; }
.btn {
  font: inherit;
  font-weight: 700;
  color: #fff;
  padding: 9px 20px;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, .1);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
  cursor: pointer;
  transition: transform .12s, background .2s;
}
.btn:hover { background: rgba(255, 255, 255, .18); }
.btn:active { transform: scale(.94); }
.btn.primary {
  padding: 12px 34px;
  font-size: 18px;
  background: linear-gradient(135deg, #7aa2ff, #c084fc);
  box-shadow: 0 8px 22px rgba(124, 92, 255, .5), inset 0 1px 0 rgba(255, 255, 255, .4);
}

/* ============ Efek layar ============ */
#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 900;
}
#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 800;
  opacity: 0;
  background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 62%);
}
#flash.on { animation: flash .55s ease-out; }
@keyframes flash { 0% { opacity: var(--o, .6); } 100% { opacity: 0; } }

/* ============ Game over ============ */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(5, 5, 20, .72);
  backdrop-filter: blur(6px);
  animation: fadeIn .3s ease;
}
.overlay.hidden, .hidden { display: none; }
@keyframes fadeIn { from { opacity: 0; } }

.modal {
  text-align: center;
  padding: 28px 38px 32px;
  border-radius: 24px;
  background: linear-gradient(160deg, rgba(60, 50, 140, .9), rgba(20, 20, 60, .95));
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .2);
  animation: modalIn .45s cubic-bezier(.2, .9, .3, 1.25);
}
@keyframes modalIn { from { transform: scale(.6) translateY(30px); opacity: 0; } }
.modal h2 { margin: 0 0 6px; font-size: 32px; letter-spacing: 2px; }
.final-label { margin: 8px 0 0; opacity: .65; letter-spacing: 2px; font-size: 12px; }
.final-score {
  font-size: 56px;
  font-weight: 900;
  margin-bottom: 6px;
  background: linear-gradient(180deg, #fff, #ffe066);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.new-best { margin: 0 0 14px; color: #ffe066; font-weight: 800; animation: bump .8s ease infinite alternate; }

@media (max-height: 640px) {
  .logo { display: none; }
  :root { --bs: max(240px, min(92vw, 440px, calc(100dvh - 300px))); }
}
</style>
</head>
<body>
  <div class="bg"></div>

  <main class="app">
    <h1 class="logo">BLOCK<span>BLAST</span></h1>

    <header class="stats">
      <div class="stat">
        <span class="label">SKOR</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat best">
        <span class="label">TERBAIK</span>
        <span id="best" class="value">0</span>
      </div>
    </header>

    <section class="board-wrap" id="boardWrap">
      <div id="board" class="board"></div>
      <div id="popup" class="popup"></div>
    </section>

    <section id="tray" class="tray">
      <div class="slot" data-i="0"></div>
      <div class="slot" data-i="1"></div>
      <div class="slot" data-i="2"></div>
    </section>

    <footer class="controls">
      <button id="restartBtn" class="btn" type="button">↻ Ulangi</button>
      <button id="soundBtn" class="btn" type="button" aria-label="Suara">🔊</button>
    </footer>
  </main>

  <canvas id="fx"></canvas>
  <div id="flash"></div>

  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <h2>Game Over</h2>
      <p class="final-label">Skor kamu</p>
      <div id="finalScore" class="final-score">0</div>
      <p id="newBest" class="new-best hidden">🏆 Rekor baru!</p>
      <button id="playAgain" class="btn primary" type="button">Main Lagi</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
